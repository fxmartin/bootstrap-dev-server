# ABOUTME: The machines this server's acmd aggregates for the Android app (acm Epic-17)
# ABOUTME: scripts/setup-acm-fleet.sh copies them into a marker block in ~/.config/acm/config.toml
#
# Same keys as acm's [[peers]]:
#   label   host name the aggregator shows; keep it equal to the machine's acm label
#   ssh     tailnet host as user@host: the peers log in as fxmartin (agent-memory as root),
#           not this server's user
#   socket  the peer's acmd socket, always an absolute path (no ~): with it acmd runs no
#           remote command, so the peer key can be limited to the socket forward. Macs:
#           /Users/<user>/.local/state/acm/acm.sock; Linux: /run/user/<uid>/acm.sock
#
# Peers added by hand to config.toml, outside the block, are kept, and win over an
# entry here with the same label.

[[peers]]
label = "omarchy-xps13"
ssh = "fxmartin@omarchy-xps13"
socket = "/run/user/1000/acm.sock"

[[peers]]
label = "macbook-pro-m3-max"
ssh = "fxmartin@macbook-pro-m3-max"
socket = "/Users/fxmartin/.local/state/acm/acm.sock"

[[peers]]
label = "home-lab"
ssh = "fxmartin@home-lab"
socket = "/Users/fxmartin/.local/state/acm/acm.sock"

# Resources only: acmd runs as root in monitor role (acm Story 16.5-001), no herdr or sdlc.
# Its root authorized_keys must hold this server's ~/.ssh/id_acm_peers.pub.
[[peers]]
label = "agent-memory"
ssh = "root@hermes-agent"
socket = "/run/user/0/acm.sock"
